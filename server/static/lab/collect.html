<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>接诊 · Agent 会诊室</title>
    <style>
      :root {
        --bg: #0a0d10; --panel: #11161b; --line: #1e252d; --text: #e7edf3; --muted: #8a97a4;
        --cyan: #38bdb4; --red: #f0555c; --green: #46c97f; --amber: #e0a34a;
        --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
      .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
      button {
        background: var(--cyan); color: #04211f; border: 0; border-radius: 7px;
        padding: 9px 18px; font: 600 13px/1 system-ui; cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
      select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: 13px var(--mono); }
      .stats { display: flex; gap: 26px; margin: 18px 0; font: 13px var(--mono); color: var(--muted); flex-wrap: wrap; }
      .stats b { color: var(--text); font-size: 18px; display: block; }
      #log {
        background: #06090b; border: 1px solid var(--line); border-radius: 8px; padding: 14px;
        font: 12px/1.7 var(--mono); height: 460px; overflow: auto; white-space: pre-wrap; word-break: break-all;
      }
      .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); } .dim { color: var(--muted); }
      .hide { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>接诊</h1>
      <p class="sub">在浏览器里真实跑一批任务，把每一步决策落成轨迹。模型调用走平台额度，不需要任何密钥。</p>

      <div class="bar">
        <select id="model"></select>
        <select id="version">
          <option value="v1">v1 基线版</option>
          <option value="v2">v2 规范版</option>
          <option value="both">v1 + v2（对比）</option>
        </select>
        <select id="repeat">
          <option value="1">每任务 1 次</option>
          <option value="2">每任务 2 次</option>
          <option value="3">每任务 3 次</option>
        </select>
        <button id="run">开始接诊</button>
        <button id="dump" class="ghost">导出全部轨迹</button>
        <button id="stop" class="ghost" disabled>中止</button>
      </div>

      <div class="stats">
        <div><b id="s-done">0</b>已跑</div>
        <div><b id="s-fail">0</b>失败</div>
        <div><b id="s-token">0</b>tokens</div>
        <div><b id="s-state">待开始</b>状态</div>
      </div>

      <div id="log"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
    <script type="module">
      import { runTask, judge } from "./agent.js";

      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      let abort = null;
      let done = 0, failed = 0, tokens = 0;

      function log(html) {
        logEl.innerHTML += html + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      const boot = await fetch("/api/lab/bootstrap").then((r) => r.json());
      const cloud = WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: boot.publicConfig.endpoint,
        oauthRelayBaseUrl: boot.publicConfig.oauthRelayBaseUrl,
        publishableKey: boot.publicConfig.publishableKey,
      });

      let models = [];
      try {
        models = await cloud.llm.models.list();
      } catch (e) {
        log(`<span class="bad">模型列表获取失败：${e.message}</span>`);
      }
      const usable = models.filter((m) => m.disabled !== true);
      if (!usable.length) {
        log(`<span class="bad">没有可用模型（返回 ${models.length} 个）</span>`);
      }
      for (const m of usable) {
        const o = document.createElement("option");
        o.value = m.id;
        o.textContent = `${m.name ?? m.id}${m.supportsToolCall ? " · tools" : ""}`;
        $("model").appendChild(o);
      }
      log(`<span class="dim">世界：${boot.world.meta.orders} 订单 / ${boot.world.meta.users} 用户 / ${boot.world.meta.policies} 条政策；任务 ${boot.tasks.length} 个；可用模型 ${usable.length} 个</span>`);

      $("stop").onclick = () => abort?.abort();

      $("run").onclick = async () => {
        const model = $("model").value;
        if (!model) return log(`<span class="bad">先选一个模型</span>`);
        const vsel = $("version").value;
        const versions = vsel === "both" ? ["v1", "v2"] : [vsel];
        const repeat = Number($("repeat").value);

        abort = new AbortController();
        $("run").disabled = true; $("stop").disabled = false; $("s-state").textContent = "运行中";

        const queue = [];
        for (const v of versions) for (const t of boot.tasks) for (let r = 0; r < repeat; r++) queue.push({ v, t, r });

        for (const { v, t, r } of queue) {
          if (abort.signal.aborted) break;
          try {
            const run = await runTask({
              cloud, model,
              task: t,
              world: boot.world,
              systemPrompt: boot.prompts.versions[v].system,
              promptVersion: v,
              runIndex: r + 1,
              signal: abort.signal,
            });
            const verdict = judge(run, t);
            run.success = verdict.success;
            run.actual = verdict.actual;
            run.fail_reason = verdict.fail_reason;
            done++; tokens += run.usage.total_tokens;
            if (!verdict.success) failed++;
            $("s-done").textContent = done; $("s-fail").textContent = failed; $("s-token").textContent = tokens;
            const steps = run.steps.filter((s) => s.kind === "tool_call").map((s) => s.ok ? s.tool : `${s.tool}!`).join(" → ");
            log(
              `<span class="${verdict.success ? "ok" : "bad"}">[${v}] ${t.task_id} #${r + 1} ${verdict.success ? "PASS" : "FAIL"}</span> ` +
              `<span class="dim">${steps || "未调用工具"}</span>` +
              (verdict.success ? "" : `\n    <span class="warn">${verdict.fail_reason}</span>`)
            );
            await fetch("/api/lab/ingest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify([run]) });
          } catch (e) {
            log(`<span class="bad">[${v}] ${t.task_id} 异常：${e.message}</span>`);
          }
        }

        $("run").disabled = false; $("stop").disabled = true; $("s-state").textContent = "已完成";
        log(`<span class="dim">—— 结束：${done} 条，失败 ${failed} 条，共 ${tokens} tokens ——</span>`);
      };

      $("dump").onclick = async () => {
        const res = await fetch("/api/lab/dump");
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "corpus.json";
        a.click();
      };
    </script>
  </body>
</html>
